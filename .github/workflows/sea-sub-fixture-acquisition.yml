name: SEA-SUB selected-anchor retention

on:
  pull_request:
    branches: [feature/product-4-real-world-corpus]
    paths:
      - .github/workflows/sea-sub-fixture-acquisition.yml
      - docs/research/product4/sea_subsurface/**
      - tests/corpus/real_world/test_sea_subsurface_research_fixtures.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retain-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-4-sea-subsurface-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire retained selected-anchor artifact
        shell: bash
        run: |
          set -euo pipefail
          lane="docs/research/product4/sea_subsurface"
          artifact="${lane}/fixtures/ioos_uaf_unit_191_profile_1709942882.csv"
          inspection="${lane}/acquisition/ioos_profile_1709942882_inspection.json"
          query="$(grep -m1 '^https://' "${lane}/acquisition/ioos_profile_query.txt")"
          mkdir -p "$(dirname "${artifact}")" "$(dirname "${inspection}")"
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            --output "${artifact}" "${query}"
          test "$(sha256sum "${artifact}" | cut -d' ' -f1)" = \
            "29114562885c844dec7440148a4dbe8bfbc21efcc4f793190bdd0c5ff2a6d13a"
          test "$(wc -c < "${artifact}")" -eq 15465
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          from collections import Counter
          from datetime import datetime
          from itertools import pairwise
          from pathlib import Path


          LANE = Path("docs/research/product4/sea_subsurface")
          SOURCE = LANE / "fixtures/ioos_uaf_unit_191_profile_1709942882.csv"
          TARGET = LANE / "acquisition/ioos_profile_1709942882_inspection.json"
          MISSING = {"", "NaN", "nan", "null", "-999", "-9999.9"}


          def present(value: str) -> bool:
              return value.strip() not in MISSING
          ####


          def count_pair(rows: list[dict[str, str]], first: str, second: str) -> int:
              return sum(present(row[first]) and present(row[second]) for row in rows)
          ####


          def count_field(rows: list[dict[str, str]], field: str) -> int:
              return sum(present(row[field]) for row in rows)
          ####


          def numeric_range(rows: list[dict[str, str]], field: str) -> dict[str, float] | None:
              values = [float(row[field]) for row in rows if present(row[field])]
              return None if not values else {"minimum": min(values), "maximum": max(values)}
          ####


          with SOURCE.open(newline="", encoding="iso-8859-1") as stream:
              reader = csv.reader(stream)
              header = next(reader)
              units = next(reader)
              rows = [dict(zip(header, row, strict=True)) for row in reader]

          times = [datetime.fromisoformat(row["precise_time"].replace("Z", "+00:00")) for row in rows]
          deltas = [(later - earlier).total_seconds() for earlier, later in pairwise(times)]
          time_counts = Counter(row["precise_time"] for row in rows)
          duplicate_times = sorted(time for time, count in time_counts.items() if count > 1)
          channel_sets: dict[str, list[list[str]]] = {}
          identity = {"trajectory", "wmo_id", "profile_id", "precise_time", "latitude", "longitude"}
          for timestamp in duplicate_times:
              channel_sets[timestamp] = [
                  sorted(
                      field
                      for field, value in row.items()
                      if field not in identity and present(value)
                  )
                  for row in rows
                  if row["precise_time"] == timestamp
              ]

          payload = {
              "inspection_version": "sea-sub-selected-anchor-inspection-v0.2",
              "source_dataset_id": "ioos-ngdac-uaf-unit_191-20240309T1200",
              "source_artifact": {
                  "path": "fixtures/ioos_uaf_unit_191_profile_1709942882.csv",
                  "query_path": "acquisition/ioos_profile_query.txt",
                  "sha256": hashlib.sha256(SOURCE.read_bytes()).hexdigest(),
                  "byte_size": SOURCE.stat().st_size,
                  "acquired_at_utc": "2026-08-24T21:23:55Z",
                  "http_status": 200,
                  "media_type": "text/csv;charset=ISO-8859-1",
                  "erddap_version": "2.30.0",
                  "response_filename": "unit_191-20240309T1200_8a71_2ac2_31bb.csv",
                  "github_actions_run_id": 32779262198,
              },
              "identity": {
                  "trajectory": sorted({row["trajectory"] for row in rows}),
                  "wmo_id": sorted({row["wmo_id"] for row in rows}),
                  "profile_id": sorted({int(row["profile_id"]) for row in rows}),
              },
              "shape": {"column_count": len(header), "data_row_count": len(rows), "units_row_count": 1},
              "time": {
                  "system": "UTC",
                  "first": times[0].isoformat(),
                  "last": times[-1].isoformat(),
                  "out_of_order_count": sum(delta < 0.0 for delta in deltas),
                  "duplicate_timestamp_count": len(duplicate_times),
                  "duplicate_timestamps": duplicate_times,
                  "maximum_positive_gap_s": max((delta for delta in deltas if delta > 0.0), default=None),
              },
              "source_units": dict(zip(header, units, strict=True)),
              "channel_presence": {
                  "onboard_gps_rows": count_pair(rows, "m_gps_lat", "m_gps_lon"),
                  "dead_reckoned_rows": count_pair(rows, "m_lat", "m_lon"),
                  "coincident_gps_dead_reckoned_rows": sum(
                      present(row["m_gps_lat"])
                      and present(row["m_gps_lon"])
                      and present(row["m_lat"])
                      and present(row["m_lon"])
                      for row in rows
                  ),
                  "pressure_rows": count_field(rows, "pressure"),
                  "source_depth_rows": count_field(rows, "m_depth"),
                  "standardized_depth_rows": count_field(rows, "depth"),
                  "heading_rows": count_field(rows, "m_heading"),
                  "pitch_rows": count_field(rows, "m_pitch"),
                  "roll_rows": count_field(rows, "m_roll"),
              },
              "numeric_ranges": {
                  field: numeric_range(rows, field)
                  for field in (
                      "m_gps_lat", "m_gps_lon", "m_lat", "m_lon", "m_depth",
                      "pressure", "depth", "latitude", "longitude",
                  )
              },
              "duplicate_timestamp_channel_sets": channel_sets,
              "quality_findings": [
                  {
                      "code": "SEA_SUB_ASYNCHRONOUS_CHANNEL_EVENTS",
                      "severity": "contract_relevant",
                      "finding": "Rows are sparse channel events rather than complete joint state vectors. Duplicate timestamps carry different populated channels and must not be dropped by row-level deduplication.",
                  },
                  {
                      "code": "SEA_SUB_GPS_UNITS_VALUE_MISMATCH",
                      "severity": "adapter_blocking_for_generic_conversion",
                      "finding": "The units row declares degrees_minutes for m_gps_lat/m_gps_lon, while retained values fit decimal-degree ranges and align with the local geodetic neighborhood. This artifact must not receive DDMM conversion.",
                  },
                  {
                      "code": "SEA_SUB_GPS_PHASE_NOT_PROVEN",
                      "severity": "claim_boundary",
                      "finding": "The artifact contains one onboard GPS event but does not prove a surface-phase label.",
                  },
                  {
                      "code": "SEA_SUB_PROFILE_POSITION_IS_CONTEXT",
                      "severity": "feature_guardrail",
                      "finding": "Provider-standardized latitude/longitude are constant across the selected profile and behave as profile-level context.",
                  },
              ],
              "mapping_decisions": {
                  "m_gps_lat_lon": {
                      "state_role": "source_observation",
                      "value_basis": "measured",
                      "target_channel": "onboard_gps_horizontal_position",
                      "artifact_encoding": "decimal_degrees_as_retained",
                      "datum": "provider_geodetic_horizontal_unresolved",
                      "surface_phase_inferred": False,
                  },
                  "m_lat_lon": {
                      "state_role": "estimate",
                      "value_basis": "dead_reckoned",
                      "target_channel": "underwater_horizontal_position",
                  },
                  "pressure": {"state_role": "source_observation", "value_basis": "measured", "units": "dbar"},
                  "m_depth": {
                      "state_role": "estimate",
                      "value_basis": "calculated_from_pressure",
                      "units": "m",
                      "vertical_reference": "sea_surface",
                      "positive_direction": "down",
                  },
              },
              "acceptance": {
                  "artifact_acquired": True,
                  "schema_inspected": True,
                  "mapping_complete": True,
                  "selected_anchor_fixture_validated": False,
                  "canonical_common_front_validated": False,
                  "lane_g2_satisfied": False,
              },
          }
          TARGET.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Repair and validate focused test formatting
        run: |
          python -m pip install --disable-pip-version-check ruff
          python -m ruff check --fix tests/corpus/real_world/test_sea_subsurface_research_fixtures.py
          python -m ruff format tests/corpus/real_world/test_sea_subsurface_research_fixtures.py

      - name: Commit retained evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/research/product4/sea_subsurface/fixtures/ioos_uaf_unit_191_profile_1709942882.csv \
            docs/research/product4/sea_subsurface/acquisition/ioos_profile_1709942882_inspection.json \
            tests/corpus/real_world/test_sea_subsurface_research_fixtures.py
          if git diff --cached --quiet; then
            echo "Selected-anchor evidence already retained."
          else
            git commit -m "data: retain SEA-SUB selected anchor evidence"
            git push origin HEAD:feature/product-4-sea-subsurface-research
          fi

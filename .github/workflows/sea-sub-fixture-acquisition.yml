name: SEA-SUB mapped-anchor validation

on:
  pull_request:
    branches: [feature/product-4-real-world-corpus]
    paths:
      - .github/workflows/sea-sub-fixture-acquisition.yml
      - docs/research/product4/sea_subsurface/**
      - tests/corpus/real_world/test_sea_subsurface_research_fixtures.py
      - tests/corpus/real_world/test_sea_subsurface_selected_anchor.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-4-sea-subsurface-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update lifecycle assertions
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path


          PATH = Path("tests/corpus/real_world/test_sea_subsurface_research_fixtures.py")
          text = PATH.read_text(encoding="utf-8")


          def replace_once(old: str, new: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f"expected test fragment not found: {old!r}")
          ####


          replace_once("assert len(json_paths) == 2", "assert len(json_paths) == 3")
          replace_once(
              "def test_portfolio_keeps_anchor_and_holdout_at_access_verified() -> None:",
              "def test_portfolio_promotes_anchor_to_mapping_complete_and_keeps_holdout_verified() -> None:",
          )
          replace_once(
              '''    assert anchor["access"]["evidence_state"] == "access_verified"\n    assert anchor["access"]["artifact_acquired"] is False\n''',
              '''    assert anchor["access"]["evidence_state"] == "mapping_complete"\n    assert anchor["access"]["artifact_acquired"] is True\n    assert anchor["access"]["schema_inspected"] is True\n    assert anchor["access"]["mapping_complete"] is True\n    assert anchor["access"]["fixture_validated"] is False\n''',
          )
          replace_once(
              '''    assert status["gates"]["G1_source_portfolio"] == "complete"\n    assert status["gates"]["G2_selected_anchor_fixture"] == "open"\n''',
              '''    assert status["gates"]["G1_source_portfolio"] == "complete"\n    assert status["gates"]["selected_anchor_artifact"] == "acquired_and_inspected"\n    assert status["gates"]["G2_selected_anchor_fixture"] == "open"\n''',
          )
          replace_once(
              '''    assert updates["ioos-ngdac-uaf-unit_191-20240309T1200"]["evidence_state"] == ("access_verified")\n    assert updates["ioos-ngdac-uaf-unit_191-20240309T1200"]["fixture_validated"] is False\n''',
              '''    anchor_update = updates["ioos-ngdac-uaf-unit_191-20240309T1200"]\n    assert anchor_update["evidence_state"] == "mapping_complete"\n    assert anchor_update["artifact_acquired"] is True\n    assert anchor_update["schema_inspected"] is True\n    assert anchor_update["mapping_complete"] is True\n    assert anchor_update["fixture_validated"] is False\n''',
          )
          PATH.write_text(text, encoding="utf-8")
          PY

      - name: Install focused validation tools
        run: python -m pip install --disable-pip-version-check pytest PyYAML ruff pyright

      - name: Format focused tests
        run: |
          python -m ruff check --fix \
            tests/corpus/real_world/test_sea_subsurface_research_fixtures.py \
            tests/corpus/real_world/test_sea_subsurface_selected_anchor.py
          python -m ruff format \
            tests/corpus/real_world/test_sea_subsurface_research_fixtures.py \
            tests/corpus/real_world/test_sea_subsurface_selected_anchor.py

      - name: Commit test lifecycle update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            tests/corpus/real_world/test_sea_subsurface_research_fixtures.py \
            tests/corpus/real_world/test_sea_subsurface_selected_anchor.py
          if git diff --cached --quiet; then
            echo "Focused tests already current."
          else
            git commit -m "test: align SEA-SUB lifecycle assertions"
            git push origin HEAD:feature/product-4-sea-subsurface-research
          fi

      - name: Run focused tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/corpus/real_world/test_sea_subsurface_research_fixtures.py
          tests/corpus/real_world/test_sea_subsurface_selected_anchor.py
      - name: Run Ruff
        run: |
          python -m ruff check \
            tests/corpus/real_world/test_sea_subsurface_research_fixtures.py \
            tests/corpus/real_world/test_sea_subsurface_selected_anchor.py
          python -m ruff format --check \
            tests/corpus/real_world/test_sea_subsurface_research_fixtures.py \
            tests/corpus/real_world/test_sea_subsurface_selected_anchor.py
      - name: Run Pyright
        run: >-
          pyright
          tests/corpus/real_world/test_sea_subsurface_research_fixtures.py
          tests/corpus/real_world/test_sea_subsurface_selected_anchor.py

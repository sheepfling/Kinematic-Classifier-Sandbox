- source_field_or_group: ins_vel_frame.x, ins_vel_frame.y
  semantic_channel: source_frame_horizontal_velocity
  units: m/s
  state_role: estimate
  value_basis: postprocessed
  source_or_derived: source
  availability: present
  sentinel_or_missing_rules: []
  uncertainty_or_quality_indicators: []

native_trajectory:
  native_unit: sensor recording
  identity_fields:
  - source file
  - full-dataset recording identity
  parent_child_structure: dataset -> recording -> synchronized sensor samples
  segmentation_semantics: one recording is parent episode; maneuvers are segments
  sample_count_or_scale: Committed sample is documented as ten seconds; six records were inspected locally.
  sampling_pattern: regular ADMA INS state time plus irregular ROS transport time
observation:
  observation_modality: multi_sensor_vehicle_state_measurement
  state_roles_present:
  - source_observation
  - estimate
  - reference_measurement
  value_bases_present:
  - measured
  - postprocessed
  observer_or_navigation_system: GeneSys ADMA, Correvit, and onboard sensors
  physical_truth_available: false
  truth_or_reference_notes: Reference measurements are not universal simulation truth.
time:
  source_time_system: GPS week/ADMA milliseconds plus ROS transport timestamp
  absolute_time_available: true
  epoch_or_reference: source GPS week retained locally; not committed
  units_or_encoding: milliseconds and nanosecond text
  precision_or_resolution: 10 ms ADMA INS interval
  rollover_or_leap_second_notes: Source leap-second metadata was preserved locally; no UTC conversion
    was performed.
frames:
- frame_id: revsted_adma_ins_geodetic_horizontal
  frame_kind: geodetic
  axes:
  - latitude
  - longitude
  - unavailable_vertical
  axis_units:
  - degree
  - degree
  - m
  center_or_origin: Earth-referenced geodetic coordinates reported by ADMA INS
  vertical_reference: unresolved
  vertical_positive_direction: unresolved
  crs_or_datum: source ADMA GNSS/INS datum; WGS-84 not asserted
  reference_epoch: null
  local_origin: null
  notes:
  - Third position component is invalid.
  - Source INS height is separate because its datum is unresolved.
- frame_id: revsted_adma_ins_relative_xy
  frame_kind: other_declared
  axes:
  - source_relative_x
  - source_relative_y
  - unavailable_vertical
  axis_units:
  - m
  - m
  - m
  center_or_origin: ADMA source-defined local relative origin
  vertical_reference: unavailable
  vertical_positive_direction: unavailable
  crs_or_datum: null
  reference_epoch: null
  local_origin: source-defined; exact origin and orientation unresolved
  notes:
  - Third position and velocity components are invalid.
channels:
- source_field_or_group: ins_time_week, ins_time_msec, leap_seconds
  semantic_channel: vehicle_state_time
  units: GPS week / ms / s
  state_role: estimate
  value_basis: reported
  source_or_derived: source
  availability: present
  sentinel_or_missing_rules: []
  uncertainty_or_quality_indicators: []
- source_field_or_group: rosbagTimestamp
  semantic_channel: transport_timestamp
  units: ns
  state_role: source_observation
  value_basis: reported
  source_or_derived: source
  availability: present
  sentinel_or_missing_rules: []
  uncertainty_or_quality_indicators:
  - not canonical state time
- source_field_or_group: ins_lat_abs, ins_long_abs
  semantic_channel: geodetic_horizontal_position
  units: degree
  state_role: estimate
  value_basis: postprocessed
  source_or_derived: source
  availability: present
  sentinel_or_missing_rules: []
  uncertainty_or_quality_indicators: []
- source_field_or_group: ins_pos_rel_x, ins_pos_rel_y
  semantic_channel: source_relative_horizontal_position
  units: m
  state_role: estimate
  value_basis: postprocessed
  source_or_derived: source
  availability: present
  sentinel_or_missing_rules: []
  uncertainty_or_quality_indicators:

  - track id
  parent_child_structure: recording -> track -> frame samples
  segmentation_semantics: one track within a recording
  sample_count_or_scale: 60 recordings; 110,500 vehicles; 44,500 km; 147 driven hours
  sampling_pattern: regular
observation:
  observation_modality: drone_video_optical_tracking
  state_roles_present:
  - estimate
  value_bases_present:
  - postprocessed
  observer_or_navigation_system: drone video trajectory extraction
  physical_truth_available: false
  truth_or_reference_notes: position/kinematics are extracted estimates
time:
  source_time_system: frame_index
  absolute_time_available: false
  epoch_or_reference: recording start
  units_or_encoding: frame plus recording frameRate
  precision_or_resolution: recording-specific frame rate
  rollover_or_leap_second_notes: null
frames:
- frame_id: highd_recording_image_xy
  frame_kind: other_declared
  axes:
  - x right
  - y down
  - vertical unavailable
  axis_units:
  - m
  - m
  - unavailable
  crs_or_datum: null
  center_or_origin: upper-left corner of each recording image
  reference_epoch: null
  vertical_reference: unavailable
  vertical_positive_direction: unavailable

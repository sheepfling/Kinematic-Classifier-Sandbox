  retrieval_method: individual application and manual approval
  authentication_required: true
  terms_or_license_id: highD non-commercial terms
  license_text_or_reference: https://levelxdata.com/highd-dataset/
  redistribution_allowed: false
  derived_data_redistribution_allowed: false
  privacy_or_sensitive_data_notes: null
  export_or_control_notes: No distribution of dataset or modified versions; non-commercial

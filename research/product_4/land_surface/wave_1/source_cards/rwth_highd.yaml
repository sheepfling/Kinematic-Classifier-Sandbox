  trajectory_derived_assertions:
  - lane-change and headway summaries
  analyst_or_proxy_assertions: []
  unavailable_or_unsafe_targets:
  - make
  - model
  - mass
  label_dependency_channels: {}
population:
  represented_platforms_or_regimes:
  - car
  - truck
  - highway traffic
  temporal_coverage: 60 recordings
  geographic_or_operational_coverage: six German highway locations
  population_biases:
  - highway-only
  - Germany
  - single provider pipeline
  known_exclusions:
  - urban multimodal traffic
  - vertical state
quality_and_segmentation:
  known_sentinels:
  - -1 in unavailable summary DHW/THW/TTC
  - 0 in unavailable per-frame relational fields
  duplicate_or_rebroadcast_behavior: pending artifact
  gap_behavior: pending artifact
  reset_or_discontinuity_behavior: recording-local
  source_transition_behavior: do not merge recording frames without transform
  physically_implausible_or_projection_risks:
  - bounding-box corner semantics
  - sentinel misuse
  proposed_episode_segmentation: recording id + track id
  proposed_segment_annotations:
  - lane_change
  - quality_warning
leakage_and_grouping:
  physical_platform_key_available: true
  event_or_mission_key_available: false
  source_recording_key_available: true
  route_key_available: true
  geography_key_available: true
  temporal_collection_key_available: true
  provider_or_source_key: true
  raw_identity_restrictions:

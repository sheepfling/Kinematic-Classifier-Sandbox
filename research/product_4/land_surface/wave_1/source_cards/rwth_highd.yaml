  first_independent_validation: secondary source-shift validation
  refresh_strategy: pin delivered files and hashes
claim_boundary:
  supports:
  - independent car/truck highway validation
  does_not_support:
  - redistribution under standard terms
  - commercial use
  - urban multimodal classes

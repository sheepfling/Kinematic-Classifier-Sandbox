study_id: new_study_workflow_demo
title: Constant Velocity vs Constant Acceleration Workflow Demo
hypothesis: >
  The `constant_velocity` versus `constant_acceleration` study should show
  that instantaneous evidence is a weak lower bound, shape-window features
  improve boundary behavior, and model-residual evidence justifies the
  Kalman-bank rung on a harder dynamics-sensitive pair.
classes:
  - constant_velocity
  - constant_acceleration
class_pairs:
  - constant_velocity_vs_constant_acceleration
feature_sets:
  - instantaneous
  - shape_window
  - model_residuals
classifiers:
  - pointwise
  - windowed_shape_features
  - bayes_accumulator
  - kalman_bank
priors:
  - uniform
  - mild_bias
corpus_objective:
  difficulty: boundary
  sampling: irregular
  noise: moderate
seed: 7
trajectories_per_case: 8
trajectories_per_class: 5
common_experiment_config: experiments/common_1d_classifier_study/common_experiment_config.yaml

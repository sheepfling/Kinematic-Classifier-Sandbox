[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinematic-classifier-sandbox"
version = "0.1.0"
description = "Survey-first sandbox for kinematic classification methods."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Rick" }]
dependencies = ["matplotlib>=3.10", "numpy>=2.0", "mdutils>=1.8.1", "pydantic>=2.11", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pyright>=1.1", "pytest>=8.0", "ruff>=0.8"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3"]
classifiers = [
    "aeon>=1.4",
    "scikit-learn>=1.7",
    "sktime>=1.0",
    "torch>=2.12",
    "ts2vec>=0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [
    ".cache",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "archive",
    "artifacts",
    "build",
    "cache",
    "docs",
    "src/**/*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "product1: Static Admissibility tests",
    "product2: Classifier Evidence Ladder tests",
    "product3: RL Corpus Exploration tests",
    "product4: Real-World Corpus and Validation tests",
    "cross_product: tests spanning multiple products or repository infrastructure",
    "product4_common: Product 4 common-contract tests",
    "product4_cross_domain: Product 4 cross-domain portfolio and gate tests",
    "product4_analysis: Product 4 analysis-product boundary tests",
    "product4_land_surface: Product 4 LAND lane tests",
    "product4_sea_surface: Product 4 SEA-SURF lane tests",
    "product4_sea_subsurface: Product 4 SEA-SUB lane tests",
    "product4_air_atmospheric: Product 4 AIR lane tests",
    "product4_space_near: Product 4 SPACE-NEAR lane tests",
    "product4_space_orbital: Product 4 SPACE-ORB lane tests",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

  latex: "\\tilde{r}_k(c)=\\log p_{k-1}(c)+\\ell_k(c),\\ \\log Z_k=\\log\\sum_{c'\\in\\mathcal{C}}\\exp(\\tilde{r}_k(c')),\\ \\log p_k(c)=\\tilde{r}_k(c)-\\log Z_k"

nasa_iss_oem_source_card:
  source_card_version: trajectory-source-card-v0.1
  contract_version: trajectory-corpus-v0.1
  source_dataset_id: nasa-topo-iss-oem
  program_domain: space
  corpus_sublane: space_orbital
  identity:
    publisher: NASA/JSC/FOD/TOPO
    dataset_title: International Space Station Trajectory Data — CCSDS Orbit Ephemeris Message
    source_version: >-
      OEM created 2022-04-27T15:05:27.413Z; immutable mirror revision
      02a720df6f2103a7a3af88b24f165c18634bca41
    citation: >-
      NASA ISS Trajectory Data generated by the ISS Trajectory Operations and Planning Officer
    official_landing_page: https://spotthestation.nasa.gov/trajectory_data.cfm
    documentation_references:
      - https://catalog.data.gov/dataset/iss-coords-2020-10-10
      - https://gist.github.com/djflux/5061eae243d62c9fadefe610db729ad8
  access:
    status: artifact_acquired_bounded_extract
    authentication_required: false
    terms_or_license_id: US-PD
    redistribution_allowed: true
    derived_data_redistribution_allowed: true
  artifacts:
    committed_fixture: tests/corpus/real_world/fixtures/nasa_iss_oem_20220427_excerpt.kvn
    committed_fixture_uri: >-
      repository://tests/corpus/real_world/fixtures/nasa_iss_oem_20220427_excerpt.kvn
    fixture_sha256: b74e25876f2c79a191e4cde111775bf4f4c6a8f00f6ea4656329f269b9841b28
    original_source_url: >-
      https://gist.github.com/djflux/5061eae243d62c9fadefe610db729ad8/raw/02a720df6f2103a7a3af88b24f165c18634bca41/ISS.OEM_J2K_EPH-202204300946.txt
    original_source_sha256: null
    extraction_rule: >-
      Preserve the original header and single metadata segment, then retain source state rows
      42 through 54 inclusive without altering numeric text.
  observation:
    observation_modality: operational flight-dynamics predicted ephemeris
    state_roles_present:
      - estimate
    value_bases_present:
      - operational_prediction
    physical_truth_available: false
    truth_or_reference_notes: Operational predicted trajectory; not measurement truth.
  time:
    source_time_system: UTC
    parser_scope: single-segment state-only OEM with TIME_SYSTEM=UTC
    absolute_time_available: true
    fixture_interval: 2022-04-27T12:00:00Z through 2022-04-27T12:48:00Z
  frames:
    - frame_id: EME2000
      frame_kind: cartesian_inertial
      center_or_origin: Earth geocenter
      source_position_units: km
      source_velocity_units: km/s
  labels:
    native_assertions:
      - OBJECT_NAME=ISS
      - OBJECT_ID=1998-067-A
    identity_linked_assertions:
      - canonical COSPAR identity 1998-067A
    trajectory_derived_assertions:
      - persistent_orbit lane membership
    unavailable_or_unsafe_targets:
      - measurement truth
      - maneuver labels without bounded evidence
  leakage_and_grouping:
    split_group_id: physical_object:1998-067A
    prohibited_classifier_inputs:
      - ISS name
      - OBJECT_ID
      - provider
      - creation date
      - product identifiers
  study_eligibility:
    classifier_eligible: false
    validation_fixture_only: true
    reason: Wave 1 proves ingestion and contract semantics; it is not a population study.
  claim_boundary:
    supports:
      - real named-inertial source fixture
      - operational predicted LEO trajectory
      - source position and velocity preservation
      - public-domain bounded-fixture redistribution
    does_not_support:
      - measurement truth
      - independence from other ISS products
      - population-level classifier conclusions
  research_evidence_state: fixture_validated
  repository_release_state: bounded_fixture_validation_only
igs_final_sp3_source_card:
  source_card_version: trajectory-source-card-v0.1
  contract_version: trajectory-corpus-v0.1
  source_dataset_id: igs-final-sp3
  program_domain: space
  corpus_sublane: space_orbital
  identity:
    publisher: International GNSS Service (IGS)
    dataset_title: IGS Final satellite orbit products
    source_version: IGS0OPSFIN daily SP3-c product, long filename convention
    citation: International GNSS Service products; acknowledge IGS and contributing analysis centers
    official_landing_page: https://igs.org/products/
    documentation_references:
      - https://igs.org/data-access/
      - https://files.igs.org/pub/data/format/sp3c.txt
      - https://files.igs.org/pub/station/general/igs_satellite_metadata.snx
  access:
    status: fixture_validated_restricted_external_packet
    production_retrieval_method: official immutable daily archive
    wave1_inspection_method: immutable third-party Git mirror
    authentication_required: false
    pr_artifact_inclusion: metadata_and_parser_only_no_mirror_bytes
    release_blocker: exact official compressed artifact acquisition and content comparison
  native_trajectory:
    native_unit: object_ephemeris
    identity_fields:
      - SP3 satellite identifier
      - epoch-valid IGS SVN/COSPAR mapping
    sampling_pattern: regular 900-second epochs for the inspected final product
  observation:
    observation_modality: postprocessed combined GNSS precise orbit solution
    state_roles_present:
      - reference_solution
    value_bases_present:
      - postprocessed_combination
    physical_truth_available: false
  time:
    source_time_system: GPS / IGS time as declared by the SP3 header
    parser_conversion_rule: GPS seconds are emitted only when the header explicitly declares GPS
  frames:
    - frame_id: IGS20
      frame_kind: cartesian_earth_fixed
      center_or_origin: Earth geocenter
  channels:
    - source_field_or_group: P satellite records
      semantic_channel: position_xyz
      units: km
      source_or_derived: source
    - source_field_or_group: P satellite clock field
      semantic_channel: clock_offset
      units: microseconds
      source_or_derived: source_context
  labels:
    identity_linked_assertions:
      - At 2024-003, G01 maps to SVN G063, COSPAR 2011-036A, catalog 37753.
    unavailable_or_unsafe_targets:
      - absolute truth
      - maneuver labels without independent evidence
  leakage_and_grouping:
    required_split_key: lifetime physical object after epoch-valid identity resolution
    raw_identity_restrictions:
      - PRN alone is not a lifetime-stable physical-object key.
      - >-
        PRN, SVN, COSPAR, catalog ID, provider, product, and epoch family are grouping/audit metadata.
  claim_boundary:
    supports:
      - source-faithful SP3-c position parser validation
      - precise postprocessed orbital reference trajectory semantics
    does_not_support:
      - absolute truth
      - release of third-party mirror bytes
      - official-byte equivalence until verified
  research_evidence_state: fixture_validated_restricted
  repository_release_state: parser_only_no_source_fixture
nasa_iss_oem_mapping:
  adapter_mapping_version: trajectory-adapter-mapping-v0.1
  contract_version: trajectory-corpus-v0.1
  source_dataset_id: nasa-topo-iss-oem
  adapter_id: space-orb-nasa-iss-oem
  adapter_version: 0.1.1
  program_domain: space
  corpus_sublane: space_orbital
  source_artifact_contract:
    accepted_media_types:
      - text/plain; profile=CCSDS-OEM-2.0-KVN-extract
    accepted_source_schema_versions:
      - CCSDS OEM 2.0
    parser_scope: one metadata segment, UTC time system, state rows only
    checksum_policy: exact SHA-256 for the admitted bounded fixture
  native_episode_extraction:
    native_identity_fields:
      - OBJECT_NAME
      - OBJECT_ID
    object_id_rule: 1998-067-A -> canonical COSPAR 1998-067A
    platform_group_id_rule: physical_object:1998-067A
    ordering_rule: UTC epoch ascending
  state_views:
    - state_view_id_pattern: nasa_iss_oem_eme2000_source_native_si
      state_role: estimate
      frame_id: EME2000
      normalization_assumptions:
        - km to m only
        - km/s to m/s only
        - UTC and EME2000 retained
        - no propagator or frame transformation
  field_mappings:
    - source_field: OEM epoch
      target_field_or_channel_id: timestamps_s
      target_units: Unix UTC seconds
      transform_or_derivation: parse after validating TIME_SYSTEM=UTC
    - source_field: OEM X/Y/Z
      target_field_or_channel_id: position_m
      target_units: m
      transform_or_derivation: km * 1000
    - source_field: OEM X_DOT/Y_DOT/Z_DOT
      target_field_or_channel_id: source_velocity_mps
      target_units: m/s
      transform_or_derivation: km/s * 1000
    - source_field: null
      target_field_or_channel_id: derived_velocity_mps
      target_units: m/s
      transform_or_derivation: shared Product 4 finite difference
    - source_field: null
      target_field_or_channel_id: derived_acceleration_mps2
      target_units: m/s^2
      transform_or_derivation: shared Product 4 finite difference
  prohibited_exposures:
    - ISS name
    - OBJECT_ID
    - provider
    - creation date
    - product identifiers
